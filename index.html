<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <!-- describes the page for search engines and link previews -->
    <meta
      name="description"
      content="A Hello World page in plain HTML5, with no CSS."
    />
    <!-- tell the mobile browsers what is the main theme for this page -->
    <meta name="theme-color" content="#ffffff" />
    <!-- Open Graph tags decide how this page is presented when the link is shared on social platforms and in chat apps -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hello World" />
    <meta
      property="og:description"
      content="A Hello World page written in plain HTML5, with no CSS."
    />
    <title>Hello World</title>
  </head>
  <body>
    <h1>Hello World!</h1>
    <p>
      An error has occurred while rendering this page. (code:
      <code>NO_STYLE_SHEET</code>)
    </p>
    <!-- A screenshot of workspace -->
    <figure>
      <img
        src="workspace.png"
        alt="The esc repository open in Visual Studio Code, showing the Explorer sidebar with index.html and README.md, and the index.html source in the editor."
        width="600"
        height="174"
        loading="lazy"
      />
      <figcaption>The workspace where index.html was written.</figcaption>
    </figure>
  </body>
</html>
